#
# Dependency updates. Dependabot commits are exempt from the DCO check in
# .github/workflows/ci.yml; maintainers sign off when squash-merging.

version: 2
updates:
  # pnpm workspace (root pnpm-lock.yaml covers apps/* and packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    labels: [dependencies]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      nestjs:
        patterns: ["@nestjs/*"]
        update-types: [major]
      nuxt-vue:
        patterns: ["nuxt", "@nuxt/*", "vue", "vue-router", "@vue/*"]
        update-types: [major]

  # Workflow actions (pinned by SHA; Dependabot updates SHA and tag comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
