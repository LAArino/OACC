# SPDX-FileCopyrightText: 2026 Lluís Alfons Ariño
# SPDX-License-Identifier: EUPL-1.2
#
# REUSE Specification 3.2 — https://reuse.software/spec-3.2/
# Run `reuse lint` from the repository root to check compliance.

version = 1

# Default: everything in the repository is the author's work under EUPL-1.2.
# "aggregate" keeps any in-file SPDX header and adds this information to it.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lluís Alfons Ariño"
SPDX-License-Identifier = "EUPL-1.2"

# Trivial configuration files and generated lockfiles are dedicated to the
# public domain so they can be copied freely between projects.
[[annotations]]
path = [
  ".gitignore",
  "**/.gitignore",
  ".editorconfig",
  "pnpm-lock.yaml",
  "**/pnpm-lock.yaml",
  "**/package-lock.json",
  "**/yarn.lock",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lluís Alfons Ariño"
SPDX-License-Identifier = "CC0-1.0"

# Third-party texts reproduced verbatim keep their own copyright and licence.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "DCO"
precedence = "override"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"

# OEAPI v5.0 specification vendored for the OEAPI mock (tools/oeapi-mock),
# from open-education-api/specification tag v5.0; see spec/NOTICE there.
[[annotations]]
path = ["tools/oeapi-mock/spec/oeapi-v5.0.bundled.json", "tools/oeapi-mock/spec/LICENSE.md"]
precedence = "override"
SPDX-FileCopyrightText = "2017 SURF U.A. Cooperative, Utrecht, The Netherlands"
SPDX-License-Identifier = "BSD-3-Clause"

# OpenAPI documents generated from the project's own code (pnpm openapi:generate);
# JSON cannot carry an SPDX header.
[[annotations]]
path = "docs/api/*.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lluís Alfons Ariño"
SPDX-License-Identifier = "EUPL-1.2"

# Redoc 2.5.4 standalone bundle, the OpenAPI viewer of /api/{public,admin}/v1/docs,
# copied verbatim from the npm package `redoc@2.5.4`; see
# apps/api/static/openapi/README.md. The bundle includes third-party packages,
# whose notices are the *.LICENSE.txt files next to it: MIT (Redoc, React, MobX,
# styled-components and most others), ISC (minimatch), BSD-3-Clause
# (swagger2openapi, oas-*, reftools, url-template, hoist-non-react-statics) and
# DOMPurify, dual-licensed Apache-2.0 OR MPL-2.0 and used here under Apache-2.0.
[[annotations]]
path = [
  "apps/api/static/openapi/redoc.standalone.js",
  "apps/api/static/openapi/*.LICENSE.txt",
  "apps/api/static/openapi/LICENSE",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2015-present Rebilly, Inc.",
  "The authors of the packages listed in redoc.standalone.js.LICENSE.txt",
]
SPDX-License-Identifier = "MIT AND ISC AND BSD-3-Clause AND Apache-2.0"
