#
# pgBackRest configuration (spec §10 "Backups"), mounted read-only at
# /etc/pgbackrest/pgbackrest.conf in `postgres` (archive-push), `backup`
# (backups, expiry) and the restore-drill container (restore, archive-get).
#
# One stanza, `oecp`, covers the whole PostgreSQL cluster: both databases
# (`oecp` and `keycloak`), roles and settings.
#
# Every option can be overridden by an environment variable PGBACKREST_<OPTION>
# (e.g. PGBACKREST_REPO1_RETENTION_FULL=60), which is how repo2, the second
# site, is configured: see postgres/pgbackrest-repo2.env.example. Secrets come
# from Docker secrets named pgbackrest_<option> (see bin/pgbackrest).

[global]
# repo1: volume `pgbackrest-repo` on this host.
repo1-path=/var/lib/pgbackrest
# Retention, time-based: keep every full backup (with its differentials and
# the WAL between them) needed to restore to any point of the last 35 days.
# pgBackRest expires a full backup only when the next one is itself at least
# 35 days old, so with a weekly full about 6 fulls are kept at any time.
repo1-retention-full-type=time
repo1-retention-full=35
# Small files bundled, block-level incremental differentials.
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
# Immediate checkpoint at backup start instead of waiting for the next one.
start-fast=y
process-max=2
# Restores overwrite only what differs (restore-drill.sh reuses its volume).
delta=y
# Console logging only (Docker logs); no log files inside the containers.
log-level-console=info
log-level-file=off
log-timestamp=y

# archive-push runs for every WAL segment inside PostgreSQL: warnings only.
[global:archive-push]
log-level-console=warn

[global:archive-get]
log-level-console=warn

[oecp]
pg1-path=/var/lib/postgresql/data
# Unix socket shared between `postgres` and `backup` (volume `postgres_socket`).
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=postgres
