#
# Prometheus configuration (profile `observability`, spec §10). Alert rules:
# alert-rules.yml (validated with `promtool check rules`, README "Alerting");
# notifications: Alertmanager (alertmanager/alertmanager.yml.tmpl).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: oecp

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application metrics of the api (HTTP requests) and the worker (harvests,
  # maintenance runs, IdP metadata refresh), Prometheus text format on the
  # internal network only: Traefik does not route /metrics.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          component: api
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:3001"]
        labels:
          component: worker
  # Readiness probes (blackbox exporter): /ready answers 503 when PostgreSQL or
  # Valkey is unreachable, which `up` does not show.
  - job_name: ready
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: ["http://api:3000/ready"]
        labels:
          component: api
      - targets: ["http://worker:3001/ready"]
        labels:
          component: worker
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  # Certificate Traefik serves on :443 (blackbox module http_tls, see
  # blackbox.yml): probe_ssl_earliest_cert_expiry for OecpTlsCertificateExpiring.
  # Needs blackbox-exporter on the `edge` network (Traefik is not on `backend`).
  - job_name: tls
    metrics_path: /probe
    scrape_interval: 1m
    params:
      module: [http_tls]
    static_configs:
      - targets: ["https://traefik:443/"]
        labels:
          component: edge
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  # Disk usage of the data volumes and the backup textfile metrics
  # (oecp_backup_*, oecp_wal_archive_*), written by the `backup` service.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host
  # Application metrics received over OTLP by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # Edge: request rates, status codes, rate-limit rejections.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
        labels:
          component: edge
  # Keycloak management interface (metrics-enabled at build time).
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
        labels:
          component: keycloak
  # The monitoring stack itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          component: monitoring
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
        labels:
          component: monitoring
