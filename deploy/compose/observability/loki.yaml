#
# Loki, single binary, filesystem storage (profile `observability`), with the
# time-based retention of spec §10: application logs 90 days, access logs
# (Traefik, client addresses) 30 days. The compactor deletes chunks older than
# the retention of their stream (plus retention_delete_delay). Logs arrive from
# Alloy (observability/alloy.alloy), labelled service, container, project and,
# on Traefik, log_type="access" | "app".

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Default for every stream: 90 days (spec §10 "application logs 90 days").
  retention_period: 2160h
  # Traefik access log: 30 days (spec §10). Traefik's own log stays at 90 days.
  retention_stream:
    - selector: '{service="traefik", log_type="access"}'
      priority: 1
      period: 720h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
