#
# Unit tests of alert-rules.yml (promtool test rules), see README "Alerting":
#   docker run --rm --entrypoint promtool -v "$PWD/observability:/c:ro" -w /c \
#     prom/prometheus:v3.15.0 test rules alert-rules.test.yml

rule_files:
  - alert-rules.yml

evaluation_interval: 30s

tests:
  # Two consecutive failed harvests fire after 5 minutes; one does not.
  - interval: 1m
    input_series:
      - series: 'oecp_sync_runs_consecutive_failures{job="worker",component="worker",organization_slug="uibk"}'
        values: '0 1 2 2 2 2 2 2 2 2'
      - series: 'oecp_sync_runs_consecutive_failures{job="worker",component="worker",organization_slug="urv"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: OecpHarvestFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: OecpHarvestFailing
        exp_alerts:
          - exp_labels: {severity: warning, component: worker, job: worker, organization_slug: uibk}
            exp_annotations:
              summary: "OEAPI harvest of uibk failed 2 times in a row"
              description: "The last 2 OEAPI harvests of uibk failed (spec §10: two consecutive failures). Admin panel: Network status and Sync history; usual causes: partner endpoint down, credential expired, IP allowlist."

  # Backup older than 26 h: the series starts at t=0 with a backup finished at
  # t=0 (value 0 is "never", so use 60); at 27 h it is too old.
  - interval: 1h
    input_series:
      - series: 'oecp_backup_last_success_timestamp_seconds{job="node-exporter",component="host",type="pgbackrest"}'
        values: '60x30'
      - series: 'oecp_backup_last_success_timestamp_seconds{job="node-exporter",component="host",type="uploads"}'
        values: '60+3600x30'
    alert_rule_test:
      - eval_time: 25h
        alertname: OecpBackupTooOld
        exp_alerts: []
      - eval_time: 27h
        alertname: OecpBackupTooOld
        exp_alerts:
          - exp_labels: {severity: critical, component: backup, job: node-exporter, type: pgbackrest}
            exp_annotations:
              summary: "Newest pgbackrest backup is older than 26 hours"
              description: "The newest successful pgbackrest backup finished 1d 2h 59m 0s ago (spec §10: 26 h). Check `docker compose --profile backup ps backup` and `docker compose logs backup`."
      - eval_time: 27h
        alertname: OecpBackupMissing
        exp_alerts: []

  # IdP metadata refresh never succeeded / not configured (0): no alert; a
  # refresh 30 h ago: alert after the 10-minute `for`.
  - interval: 1h
    input_series:
      - series: 'oecp_idp_metadata_refresh_last_success_timestamp_seconds{job="worker",component="worker"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 40h
        alertname: OecpIdpMetadataRefreshStale
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'oecp_idp_metadata_refresh_last_success_timestamp_seconds{job="worker",component="worker"}'
        values: '3600x2000'
    alert_rule_test:
      - eval_time: 25h
        alertname: OecpIdpMetadataRefreshStale
        exp_alerts: []
      - eval_time: 31h
        alertname: OecpIdpMetadataRefreshStale
        exp_alerts:
          - exp_labels: {severity: warning, component: worker, job: worker}
            exp_annotations:
              summary: "IdP metadata not refreshed for more than 26 hours"
              description: "The last successful IdP metadata refresh was 1d 6h 0m 0s ago (daily at 04:15 UTC). Certificates of partner IdPs may go stale."

  # 5xx ratio: 2 % of 1 req/s for 15 minutes fires; 0.5 % does not.
  - interval: 1m
    input_series:
      - series: 'oecp_http_requests_total{job="api",component="api",method="GET",route="/api/public/v1/courses",status="200"}'
        values: '0+58.8x30'
      - series: 'oecp_http_requests_total{job="api",component="api",method="GET",route="/api/public/v1/courses",status="500"}'
        values: '0+1.2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OecpApiHigh5xxRate
        exp_alerts:
          - exp_labels: {severity: warning, component: api}
            exp_annotations:
              summary: "API 5xx ratio above 1 %"
              description: "2% of the api's responses over the last 5 minutes were 5xx (spec §10 threshold 1 %). Look at the api log and the 5xx by route on the Grafana dashboard."

  # Disk: 85 % is a warning only, 95 % both levels (Alertmanager inhibits the warning).
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node-exporter:9100",device="/dev/vda1",fstype="ext4",mountpoint="/volumes/postgres_data"}'
        values: '15x20'
      - series: 'node_filesystem_size_bytes{instance="node-exporter:9100",device="/dev/vda1",fstype="ext4",mountpoint="/volumes/postgres_data"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: OecpDiskSpaceLow
        exp_alerts:
          - exp_labels: {severity: warning, component: host, instance: "node-exporter:9100", device: /dev/vda1}
            exp_annotations:
              summary: "Disk /dev/vda1 is 85 % full"
              description: "The filesystem holding the data volumes (PostgreSQL, pgBackRest repository, uploads) is more than 80 % full (spec §10). Free space or grow the disk before PostgreSQL stops."

  # WAL archiving failing for 15 minutes.
  - interval: 1m
    input_series:
      - series: 'oecp_wal_archive_last_success_timestamp_seconds{job="node-exporter",component="host"}'
        values: '1000x30'
      - series: 'oecp_wal_archive_last_failure_timestamp_seconds{job="node-exporter",component="host"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OecpWalArchivingFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: OecpWalArchivingFailing
        exp_alerts:
          - exp_labels: {severity: critical, component: backup, job: node-exporter}
            exp_annotations:
              summary: "PostgreSQL WAL archiving is failing"
              description: "archive_command (pgBackRest archive-push) has failed since its last success for 15 minutes: point-in-time recovery stops at the last archived segment and pg_wal grows. `docker compose logs postgres`, then `docker compose exec backup pgbackrest --stanza=oecp check`."

  # IdP signing certificates (values: notAfter in Unix seconds; time() starts at
  # 0): 20 days left = warning, 5 days = critical, expired a minute after the
  # start = OecpIdpCertificateExpired; a disabled IdP and 100 days: nothing.
  - interval: 1m
    input_series:
      - series: 'oecp_idp_certificate_expiry_timestamp_seconds{job="worker",component="worker",instance="worker:3001",alias="warn",enabled="true"}'
        values: '1728000x40'
      - series: 'oecp_idp_certificate_expiry_timestamp_seconds{job="worker",component="worker",instance="worker:3001",alias="crit",enabled="true"}'
        values: '432000x40'
      - series: 'oecp_idp_certificate_expiry_timestamp_seconds{job="worker",component="worker",instance="worker:3001",alias="gone",enabled="true"}'
        values: '60x40'
      - series: 'oecp_idp_certificate_expiry_timestamp_seconds{job="worker",component="worker",instance="worker:3001",alias="off",enabled="false"}'
        values: '60x40'
      - series: 'oecp_idp_certificate_expiry_timestamp_seconds{job="worker",component="worker",instance="worker:3001",alias="ok",enabled="true"}'
        values: '8640000x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: OecpIdpCertificateExpired
        exp_alerts: []
      - eval_time: 30m
        alertname: OecpIdpCertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, component: worker, job: worker, instance: "worker:3001", alias: warn, enabled: "true"}
            exp_annotations:
              summary: "SAML signing certificate of the IdP warn expires in 19d 23h 30m 0s"
              description: "The latest signing certificate Keycloak holds for the identity provider warn expires in 19d 23h 30m 0s; after that Keycloak rejects its assertions and nobody from that partner can sign in. The daily IdP metadata refresh installs the successor as soon as the federation metadata publishes it: check the refresh's last run on the Maintenance page and ask the partner for its key rollover."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"
          - exp_labels: {severity: critical, component: worker, job: worker, instance: "worker:3001", alias: crit, enabled: "true"}
            exp_annotations:
              summary: "SAML signing certificate of the IdP crit expires in 4d 23h 30m 0s"
              description: "The latest signing certificate Keycloak holds for the identity provider crit expires in 4d 23h 30m 0s and no later one is configured: sign-in through crit stops then. Get the new certificate from the partner or the federation metadata (run the IdP metadata refresh) or set it in Keycloak by hand."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"
      - eval_time: 30m
        alertname: OecpIdpCertificateExpired
        exp_alerts:
          - exp_labels: {severity: critical, component: worker, job: worker, instance: "worker:3001", alias: gone, enabled: "true"}
            exp_annotations:
              summary: "Every SAML signing certificate of the IdP gone has expired"
              description: "The latest signing certificate Keycloak holds for the enabled identity provider gone expired 29m 0s ago: Keycloak rejects its assertions and nobody from that partner can sign in. Install the partner's current certificate (IdP metadata refresh, or Keycloak by hand) or disable the IdP."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"

  # Certificate check: never succeeded on a worker up for more than a day
  # fires; a worker that checks every minute or that started recently does not.
  - interval: 1m
    input_series:
      - series: 'oecp_idp_certificate_check_last_success_timestamp_seconds{job="worker",component="worker",instance="worker:3001"}'
        values: '0x1560'
      - series: 'oecp_process_start_time_seconds{job="worker",component="worker",instance="worker:3001"}'
        values: '0x1560'
      - series: 'oecp_idp_certificate_check_last_success_timestamp_seconds{job="worker",component="worker",instance="fresh:3001"}'
        values: '0+60x1560'
      - series: 'oecp_process_start_time_seconds{job="worker",component="worker",instance="fresh:3001"}'
        values: '0x1560'
      - series: 'oecp_idp_certificate_check_last_success_timestamp_seconds{job="worker",component="worker",instance="restarted:3001"}'
        values: '0x1560'
      - series: 'oecp_process_start_time_seconds{job="worker",component="worker",instance="restarted:3001"}'
        values: '86000x1560'
    alert_rule_test:
      - eval_time: 23h
        alertname: OecpIdpCertificateCheckStale
        exp_alerts: []
      - eval_time: 25h
        alertname: OecpIdpCertificateCheckStale
        exp_alerts:
          - exp_labels: {severity: warning, component: worker, job: worker, instance: "worker:3001"}
            exp_annotations:
              summary: "IdP signing certificates not checked for more than 24 hours"
              description: "The worker has been up for more than a day but last read the identity providers' signing certificates from Keycloak 1d 1h 0m 0s ago (decades = never since it started), so the certificate alerts work on old values. Look for `IdP signing certificates not checked` in the worker log: Keycloak unreachable or the oecp-backend client lacks view-identity-providers."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"

  # TLS certificate served by Traefik: 15 days left = warning (ACME renews at
  # 30), 3 days = critical, 60 days = nothing; a failing probe.
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="tls",component="edge",instance="https://traefik:443/"}'
        values: '1296000x40'
      - series: 'probe_ssl_earliest_cert_expiry{job="tls",component="edge",instance="https://soon:443/"}'
        values: '259200x40'
      - series: 'probe_ssl_earliest_cert_expiry{job="tls",component="edge",instance="https://fine:443/"}'
        values: '5184000x40'
      - series: 'probe_success{job="tls",component="edge",instance="https://traefik:443/"}'
        values: '1x40'
      - series: 'probe_success{job="tls",component="edge",instance="https://down:443/"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: OecpTlsCertificateExpiring
        exp_alerts: []
      - eval_time: 10m
        alertname: OecpTlsProbeFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: OecpTlsCertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, component: edge, job: tls, instance: "https://traefik:443/"}
            exp_annotations:
              summary: "TLS certificate served by Traefik expires in 14d 23h 30m 0s"
              description: "The certificate Traefik serves on https://traefik:443/ expires in 14d 23h 30m 0s. ACME renews 30 days before expiry, so renewal has been failing for over a week: `docker compose logs traefik | grep -i acme` (port 443 reachable from the Internet for the TLS challenge, DNS, Let's Encrypt rate limits)."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"
          - exp_labels: {severity: critical, component: edge, job: tls, instance: "https://soon:443/"}
            exp_annotations:
              summary: "TLS certificate served by Traefik expires in 2d 23h 30m 0s"
              description: "The certificate Traefik serves on https://soon:443/ expires in 2d 23h 30m 0s (negative: expired): browsers and partner harvesters will refuse the portal. Fix the ACME renewal now (`docker compose logs traefik | grep -i acme`) or install a certificate by hand."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"
      - eval_time: 30m
        alertname: OecpTlsProbeFailing
        exp_alerts:
          - exp_labels: {severity: warning, component: edge, job: tls, instance: "https://down:443/"}
            exp_annotations:
              summary: "TLS probe of Traefik failing"
              description: "The blackbox exporter has not completed a TLS request to https://down:443/ for 15 minutes, so the TLS certificate expiry is not watched: Traefik down on :443, or blackbox-exporter not on the `edge` network."
              runbook: "docs/production/runbook.md#7-monitoring-and-alerts"
