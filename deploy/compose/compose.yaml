#
# Open European Campus Portal (OECP): reference Docker Compose deployment (MVP).
# Spec v4.1 §3 (architecture), §4 (identity), §10 (non-functional requirements).
#
# Quick start: see README.md in this directory (verified commands).
#   cp .env.example .env && (create secrets, see secrets/README.md)
#   docker compose up -d --build --wait
#   docker compose wait keycloak-config          # realm import, exit code 0
#   docker compose run --rm api pnpm db:migrate
#
# Optional observability stack (OpenTelemetry Collector, Prometheus, Loki, Alloy, Grafana):
#   docker compose --profile observability up -d
#
# Local development extras (Mailpit SMTP sink on http://127.0.0.1:8025, OEAPI v5
# mock partner on http://127.0.0.1:8090 and http://oeapi-mock:8090):
#   docker compose --profile dev up -d    (or COMPOSE_PROFILES=dev in .env)

name: oecp

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------

# Environment shared by the `api` (HTTP) and `worker` (BullMQ) processes, which
# run the same image (spec §3: one codebase, one image, two processes).
x-oecp-backend-env: &oecp-backend-env
  NODE_ENV: production
  # The password is injected from DATABASE_PASSWORD_FILE by the image entrypoint
  # (dockerfiles/oecp-entrypoint.sh), so it never appears in the environment of
  # `docker inspect` nor in this file.
  DATABASE_URL: postgres://oecp@postgres:5432/oecp
  DATABASE_PASSWORD_FILE: /run/secrets/oecp_db_password
  VALKEY_URL: redis://valkey:6379/0
  # `iss` is checked exactly against the public auth host (spec §4); the JWKS is
  # fetched over the internal network.
  KEYCLOAK_ISSUER: https://${OECP_AUTH_HOST:?set OECP_AUTH_HOST in .env}/realms/oecp
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/oecp/protocol/openid-connect/certs
  OECP_MASTER_KEY_FILE: /run/secrets/oecp_master_key
  # Public origin used in links the API generates (invitations, sitemap).
  OECP_PUBLIC_BASE_URL: https://${OECP_PORTAL_HOST:?set OECP_PORTAL_HOST in .env}
  # CSV uploads (spec §6.3) are kept here for 90 days; backed by the `uploads` volume.
  OECP_UPLOADS_DIR: /data/uploads
  # Confidential client `oecp-backend` (manage-users, view-users), spec §3.
  KEYCLOAK_ADMIN_URL: http://keycloak:8080
  KEYCLOAK_REALM: oecp
  KEYCLOAK_ADMIN_CLIENT_ID: oecp-backend
  KEYCLOAK_ADMIN_CLIENT_SECRET_FILE: /run/secrets/oecp_backend_client_secret
  # Partner OEAPI access over plain http and to private addresses is refused by
  # the SSRF rules of spec §6.2.6. Set to "true" ONLY for local development against
  # the `oeapi-mock` service (dev profile). Never in production.
  OECP_ALLOW_INSECURE_PARTNER_HTTP: ${OECP_ALLOW_INSECURE_PARTNER_HTTP:-false}
  # IT Handbook publication rule (decision 21c, spec §6.1): `warn` publishes
  # incomplete courses with a warning, `enforce` stores them as draft.
  OECP_PUBLISH_RULE: ${OECP_PUBLISH_RULE:-warn}
  # Maintenance (spec §10): dormancy stays a dry run until the alliance enables it.
  OECP_DORMANCY_DRY_RUN: ${OECP_DORMANCY_DRY_RUN:-true}
  OECP_DORMANCY_DAYS: ${OECP_DORMANCY_DAYS:-180}
  # Keycloak accounts without OECP role, 12 months after the role removal (spec
  # §2.2, §10): a dry run until the alliance enables it.
  OECP_ACCOUNT_CLEANUP_DRY_RUN: ${OECP_ACCOUNT_CLEANUP_DRY_RUN:-true}
  OECP_ACCOUNT_DELETE_MONTHS: ${OECP_ACCOUNT_DELETE_MONTHS:-12}
  OECP_RETENTION_SOFT_DELETED_MONTHS: ${OECP_RETENTION_SOFT_DELETED_MONTHS:-12}
  # Request logs carry no client address or User-Agent; true adds a salted hash.
  OECP_LOG_CLIENT_ADDRESSES: ${OECP_LOG_CLIENT_ADDRESSES:-false}
  # IdP metadata refresh (spec §4): empty URL = job disabled. The eduGAIN aggregate
  # is ~94 MB, hence the raised size limit; mount the pinned signing certificate.
  OECP_IDP_METADATA_URL: ${OECP_IDP_METADATA_URL:-}
  OECP_IDP_METADATA_SIGNING_CERT_FILE: ${OECP_IDP_METADATA_SIGNING_CERT_FILE:-}
  OECP_IDP_METADATA_MAX_BYTES: ${OECP_IDP_METADATA_MAX_BYTES:-157286400}
  OECP_IDP_METADATA_CACHE_DIR: /data/idp-metadata
  OECP_IDP_METADATA_REQUIRE_VALID_UNTIL: ${OECP_IDP_METADATA_REQUIRE_VALID_UNTIL:-true}
  OECP_IDP_METADATA_INCLUDE_DISABLED: ${OECP_IDP_METADATA_INCLUDE_DISABLED:-false}
  OECP_IDP_METADATA_REFRESH_ON_START: ${OECP_IDP_METADATA_REFRESH_ON_START:-true}
  OECP_RETENTION_HISTORY_MONTHS: ${OECP_RETENTION_HISTORY_MONTHS:-12}
  OECP_RETENTION_SYNC_ERRORS_MONTHS: ${OECP_RETENTION_SYNC_ERRORS_MONTHS:-12}
  OECP_RETENTION_SYNC_RUNS_MONTHS: ${OECP_RETENTION_SYNC_RUNS_MONTHS:-24}
  OECP_RETENTION_AUDIT_MONTHS: ${OECP_RETENTION_AUDIT_MONTHS:-36}
  SMTP_HOST: ${OECP_SMTP_HOST:-}
  SMTP_PORT: ${OECP_SMTP_PORT:-25}
  SMTP_FROM: ${OECP_SMTP_FROM:-no-reply@example.org}
  SMTP_STARTTLS: ${OECP_SMTP_STARTTLS:-true}
  # Optional SMTP AUTH: user here, password as a Docker secret (uncomment the
  # `smtp_password` secret of api and worker and in `secrets:` below).
  SMTP_USER: ${OECP_SMTP_USER:-}
  SMTP_PASSWORD_FILE: ${OECP_SMTP_PASSWORD_FILE:-}
  # NODE_ENV=production refuses to start with an empty SMTP host (invitation links
  # would only be logged) unless this is true. Development without Mailpit only.
  OECP_MAIL_LOG_LINKS: ${OECP_MAIL_LOG_LINKS:-false}
  # Prometheus metrics (spec §10): api on :3000/metrics, worker on :3001/metrics,
  # internal network only (Traefik does not route them); scraped by the
  # `observability` profile. OECP_GIT_COMMIT labels oecp_build_info{commit}.
  OECP_METRICS_ENABLED: ${OECP_METRICS_ENABLED:-true}
  OECP_GIT_COMMIT: ${OECP_GIT_COMMIT:-unknown}
  # Standard OpenTelemetry SDK variables (spec §10 Observability). The SDK is
  # disabled unless the `observability` profile is running.
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${OECP_ENVIRONMENT:-local}

x-oecp-backend-secrets: &oecp-backend-secrets
  - oecp_db_password
  - oecp_master_key
  - oecp_backend_client_secret
  # With SMTP AUTH (OECP_SMTP_USER, OECP_SMTP_PASSWORD_FILE=/run/secrets/smtp_password):
  # - smtp_password

# Log retention (spec §10; README "Log retention"). Every service logs to Docker's
# json-file driver with rotation; this stays the local fallback and the source of
# `docker compose logs`. Its limits are SIZE-based: a container keeps at most
# max-file × max-size of logs, so the age reached depends on its volume. With the
# `observability` profile, Alloy ships these logs to Loki, whose retention is
# time-based (observability/loki.yaml: 90 days, Traefik access log 30 days); the
# json-file sizes can then be reduced. Without it, size them for ~90 days.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${OECP_LOG_MAX_SIZE:-10m}
    max-file: "${OECP_LOG_MAX_FILE:-5}"

# Traefik: its own logs plus, when enabled, the access log (client addresses:
# personal data, 30 days at most). Size max-file × max-size for ~30 days.
x-logging-traefik: &traefik-logging
  driver: json-file
  options:
    max-size: ${OECP_TRAEFIK_LOG_MAX_SIZE:-20m}
    max-file: "${OECP_TRAEFIK_LOG_MAX_FILE:-10}"

services:
  # -------------------------------------------------------------------------
  # Edge proxy: Traefik Proxy v3 (MIT), spec §3 and ADR-0003.
  # -------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      # Access log (spec §10: kept 30 days at most): OFF by default. Set
      # OECP_TRAEFIK_ACCESS_LOG=true in .env to write one JSON line per request to
      # stdout, i.e. into this container's json-file log (x-logging-traefik:
      # size it for ~30 days). Request headers (User-Agent, cookies, Authorization)
      # are never logged; client addresses are. To pseudonymise or drop them, or to
      # write to a rotated file instead, uncomment and adapt:
      # - --accesslog.fields.names.ClientAddr=drop
      # - --accesslog.fields.names.ClientHost=drop
      # - --accesslog.fields.names.ClientPort=drop
      # - --accesslog.fields.names.RequestPath=keep
      # - --accesslog.filepath=/var/log/traefik/access.log   (rotate with logrotate + USR1)
      - --accesslog=${OECP_TRAEFIK_ACCESS_LOG:-false}
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --ping=true
      # Providers: Docker labels for routers, a file for shared middlewares and TLS options.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=oecp-edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Entry points: HTTP only redirects to HTTPS.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # If Traefik sits behind a load balancer, trust its X-Forwarded-For so the
      # per-IP rate limits see the client address (and set ipStrategy.depth in
      # traefik/dynamic/middlewares.yaml):
      # - --entrypoints.websecure.forwardedheaders.trustedips=10.0.0.0/8
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      # LOCAL DEVELOPMENT ONLY: dashboard without authentication on 127.0.0.1:8080.
      # TLS uses Traefik's built-in self-signed default certificate.
      - --api.dashboard=true
      - --api.insecure=true
      # --- PRODUCTION (uncomment, and remove --api.insecure above and the
      # dashboard port below) --------------------------------------------------
      # - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.tlschallenge=true
      # - --entrypoints.websecure.http.tls.certresolver=le
      # Also make the portal's ACME certificate Traefik's default one, so that the
      # in-host TLS probe (blackbox exporter, no SNI) watches it
      # (OecpTlsCertificateExpiring); Traefik takes TLS stores as labels, not flags:
      #   traefik.tls.stores.default.defaultgeneratedcert.resolver: le
      #   traefik.tls.stores.default.defaultgeneratedcert.domain.main: ${OECP_PORTAL_HOST}
    ports:
      - "${OECP_HTTP_PORT:-80}:80"
      - "${OECP_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Read-only Docker socket for the Docker provider. In production consider
      # a socket proxy (e.g. tecnativa/docker-socket-proxy) exposing only GET /containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *traefik-logging

  # -------------------------------------------------------------------------
  # Data stores
  # -------------------------------------------------------------------------
  postgres:
    # postgres:16.15 plus pgBackRest (dockerfiles/postgres.Dockerfile): same
    # PostgreSQL minor, same data volume, non-root (uid 999).
    build:
      context: ./postgres
      dockerfile: ../dockerfiles/postgres.Dockerfile
    image: oecp/postgres:${OECP_IMAGE_TAG:-dev}
    restart: unless-stopped
    shm_size: 256mb
    # WAL archiving for point-in-time recovery (spec §10 "Backups"). These
    # server settings override postgresql.conf of the data directory (command
    # line wins), so they also apply to an existing cluster: recreate the
    # container to change them. archive_command pushes every completed WAL
    # segment to the pgBackRest repositories; OECP_WAL_ARCHIVE (on, auto, off)
    # is explained in postgres/bin/oecp-pgbackrest-archive-push.
    # archive_timeout bounds the WAL not yet archived (recovery point) to 5 min.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=oecp-pgbackrest-archive-push %p
      - -c
      - archive_timeout=${OECP_WAL_ARCHIVE_TIMEOUT:-300}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C.UTF-8
      OECP_WAL_ARCHIVE: ${OECP_WAL_ARCHIVE:-auto}
    # Second repository (repo2, the "second site"): PGBACKREST_REPO2_* variables,
    # see postgres/pgbackrest-repo2.env.example. Optional file.
    env_file:
      - path: ./.env.pgbackrest
        required: false
    secrets:
      - postgres_superuser_password
      - oecp_db_password
      - keycloak_db_password
      # repo2 secrets, read by the pgbackrest wrapper (postgres/bin/pgbackrest):
      # - pgbackrest_repo2_cipher_pass
      # - pgbackrest_repo2_s3_key_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Unix socket, shared with the `backup` service (pgBackRest connects
      # through it; local connections are trusted, so nothing else mounts it).
      - postgres_socket:/var/run/postgresql
      # repo1, written by archive-push.
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Runs once, on an empty data directory: creates databases `oecp` and `keycloak`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
      # With repo2 on S3 or SFTP, archive-push needs outbound access:
      # - egress
    healthcheck:
      # TCP probe: during first-run initialisation the entrypoint's temporary
      # server listens on the Unix socket only, so this turns healthy only after
      # postgres/init/*.sql has completed.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    # BullMQ requires `noeviction`; AOF keeps queues across restarts (the worker
    # re-registers schedules at start anyway, spec §3).
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--save", ""]
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Identity: Keycloak 26 (Apache-2.0), spec §4 and ADR-0004.
  # -------------------------------------------------------------------------
  keycloak:
    build:
      context: ./keycloak
      dockerfile: ../dockerfiles/keycloak.Dockerfile
    image: oecp/keycloak:${OECP_IMAGE_TAG:-dev}
    restart: unless-stopped
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      # Public URL of the auth host; tokens carry iss=https://<auth-host>/realms/oecp.
      KC_HOSTNAME: https://${OECP_AUTH_HOST:?set OECP_AUTH_HOST in .env}
      # Internal callers (api JWKS, keycloak-config-cli) use http://keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # TLS terminates at Traefik; Keycloak is reachable only on internal networks.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Temporary admin in the `master` realm, used by keycloak-config-cli and
      # the operator; replace by a permanent admin with MFA after first start.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/keycloak_admin_password
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-info}
      KC_LOG_CONSOLE_OUTPUT: json
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      # The image has no curl/wget: probe the management interface (port 9000)
      # with bash built-ins only (no head/grep needed).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r -t 5 status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    labels:
      traefik.enable: "true"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
      # auth-host: realm endpoints and login-page static resources (public).
      traefik.http.routers.auth.rule: Host(`${OECP_AUTH_HOST}`) && (PathPrefix(`/realms/oecp`) || PathPrefix(`/resources`))
      traefik.http.routers.auth.entrypoints: websecure
      traefik.http.routers.auth.tls: "true"
      traefik.http.routers.auth.priority: "50"
      traefik.http.routers.auth.service: keycloak
      traefik.http.routers.auth.middlewares: security-headers-auth@file
      # Admin console and master realm: IP-allowlisted (spec §3).
      traefik.http.routers.auth-admin.rule: Host(`${OECP_AUTH_HOST}`) && (PathPrefix(`/admin`) || PathPrefix(`/realms/master`))
      traefik.http.routers.auth-admin.entrypoints: websecure
      traefik.http.routers.auth-admin.tls: "true"
      traefik.http.routers.auth-admin.priority: "60"
      traefik.http.routers.auth-admin.service: keycloak
      traefik.http.routers.auth-admin.middlewares: keycloak-admin-allowlist,security-headers-auth@file
      traefik.http.middlewares.keycloak-admin-allowlist.ipallowlist.sourcerange: ${KEYCLOAK_ADMIN_ALLOWLIST:-127.0.0.1/32}
    logging: *default-logging

  # One-shot: applies identity/keycloak/realm-oecp.yaml (realm as code) and exits.
  # `docker compose up` starts it again every time (it is idempotent, ~10 s);
  # re-apply by hand with `docker compose run --rm keycloak-config`.
  # 6.5.1-26.5.5 is the newest release (built against the Keycloak 26.5 admin
  # client; there is no 26.8 build). Verified against Keycloak 26.8.1: the whole
  # realm imports and is idempotent. Re-verify when bumping either image.
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5
    restart: "no"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      # KEYCLOAK_PASSWORD comes from the file /run/secrets/kcc/keycloak.password
      # through Spring Boot's config tree (property `keycloak.password`).
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/kcc/
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_FILES_LOCATIONS: /config/realm-oecp.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Always apply the file. With the default cache, keycloak-config-cli skips
      # the import when the file checksum is unchanged, so changes made in the
      # admin console (or by a failed earlier run) would silently survive.
      IMPORT_CACHE_ENABLED: "false"
      # Variables substituted into realm-oecp.yaml as $(env:NAME).
      OECP_PORTAL_URL: https://${OECP_PORTAL_HOST}
      OECP_AUTH_URL: https://${OECP_AUTH_HOST}
      OECP_REALM_DISPLAY_NAME: ${OECP_REALM_DISPLAY_NAME:-Open European Campus Portal}
      OECP_SMTP_HOST: ${OECP_SMTP_HOST:-}
      OECP_SMTP_PORT: ${OECP_SMTP_PORT:-25}
      OECP_SMTP_FROM: ${OECP_SMTP_FROM:-no-reply@example.org}
      OECP_SMTP_STARTTLS: ${OECP_SMTP_STARTTLS:-true}
      # Placeholders of the disabled `example-partner` IdP (must be valid URLs).
      EXAMPLE_PARTNER_IDP_ENTITY_ID: ${EXAMPLE_PARTNER_IDP_ENTITY_ID:-https://idp.example-partner.invalid/idp/shibboleth}
      EXAMPLE_PARTNER_IDP_SSO_URL: ${EXAMPLE_PARTNER_IDP_SSO_URL:-https://idp.example-partner.invalid/idp/profile/SAML2/POST/SSO}
      EXAMPLE_PARTNER_IDP_SIGNING_CERT: ${EXAMPLE_PARTNER_IDP_SIGNING_CERT:-}
      # Dev profile only: enables IdP `urv` pointing at the `test-saml-idp`
      # service on 127.0.0.1:OECP_DEV_IDP_PORT. Never true in production.
      OECP_DEV_IDP_ENABLED: ${OECP_DEV_IDP_ENABLED:-false}
      OECP_DEV_IDP_PORT: ${OECP_DEV_IDP_PORT:-8091}
    secrets:
      - source: keycloak_admin_password
        target: /run/secrets/kcc/keycloak.password
      - oecp_backend_client_secret
    volumes:
      - ../../identity/keycloak:/config:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging

  # -------------------------------------------------------------------------
  # OECP application: api (HTTP), worker (BullMQ), web (Nuxt)
  # -------------------------------------------------------------------------
  api:
    build:
      # Repository root: pnpm workspaces need the root lockfile and packages/*.
      context: ../..
      dockerfile: deploy/compose/dockerfiles/api.Dockerfile
    image: oecp/api:${OECP_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    command: ["node", "dist/main.js"]
    environment:
      <<: *oecp-backend-env
      OTEL_SERVICE_NAME: oecp-api
    secrets: *oecp-backend-secrets
    volumes:
      - uploads:/data/uploads
      - idp-metadata:/data/idp-metadata
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      # Readiness (PostgreSQL and Valkey reachable). `/health` and `/ready` are
      # served at the root of the api container, outside the /api and /oeapi
      # prefixes routed by Traefik, so they are internal only (spec §3, §10).
      # Traefik skips unhealthy containers.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.services.api.loadbalancer.server.port: "3000"
      # Generic API router: /api (public and admin) and /oeapi on the portal host.
      traefik.http.routers.api.rule: Host(`${OECP_PORTAL_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/oeapi`))
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.priority: "50"
      traefik.http.routers.api.service: api
      traefik.http.routers.api.middlewares: security-headers@file,security-headers-api@file
      # Per-IP rate limits, spec §10: search 20 r/s, suggest and /oeapi/v5 10 r/s, admin 30 r/s.
      # Explicit priorities: Traefik otherwise ranks routers by rule length.
      traefik.http.routers.api-search.rule: Host(`${OECP_PORTAL_HOST}`) && Path(`/api/public/v1/courses`)
      traefik.http.routers.api-search.entrypoints: websecure
      traefik.http.routers.api-search.tls: "true"
      traefik.http.routers.api-search.priority: "100"
      traefik.http.routers.api-search.service: api
      traefik.http.routers.api-search.middlewares: ratelimit-search@file,security-headers@file,security-headers-api@file
      traefik.http.routers.api-suggest.rule: Host(`${OECP_PORTAL_HOST}`) && Path(`/api/public/v1/suggest`)
      traefik.http.routers.api-suggest.entrypoints: websecure
      traefik.http.routers.api-suggest.tls: "true"
      traefik.http.routers.api-suggest.priority: "100"
      traefik.http.routers.api-suggest.service: api
      traefik.http.routers.api-suggest.middlewares: ratelimit-suggest@file,security-headers@file,security-headers-api@file
      traefik.http.routers.oeapi.rule: Host(`${OECP_PORTAL_HOST}`) && PathPrefix(`/oeapi/v5`)
      traefik.http.routers.oeapi.entrypoints: websecure
      traefik.http.routers.oeapi.tls: "true"
      traefik.http.routers.oeapi.priority: "100"
      traefik.http.routers.oeapi.service: api
      traefik.http.routers.oeapi.middlewares: ratelimit-oeapi@file,security-headers@file,security-headers-api@file
      traefik.http.routers.api-admin.rule: Host(`${OECP_PORTAL_HOST}`) && PathPrefix(`/api/admin`)
      traefik.http.routers.api-admin.entrypoints: websecure
      traefik.http.routers.api-admin.tls: "true"
      traefik.http.routers.api-admin.priority: "100"
      traefik.http.routers.api-admin.service: api
      traefik.http.routers.api-admin.middlewares: ratelimit-admin@file,security-headers@file,security-headers-api@file
    logging: *default-logging

  worker:
    image: oecp/api:${OECP_IMAGE_TAG:-dev}
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["node", "dist/worker.js"]
    environment:
      <<: *oecp-backend-env
      OTEL_SERVICE_NAME: oecp-worker
    secrets: *oecp-backend-secrets
    volumes:
      - uploads:/data/uploads
      # eduGAIN aggregate cache of the idp-metadata-refresh job (spec §4).
      - idp-metadata:/data/idp-metadata
    # Same image as `api` (built by the `api` service; `docker compose up` builds
    # every image before creating containers).
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend
      # Outbound HTTPS to partner OEAPI endpoints (allowlisted in the application, spec §6.2.6).
      - egress
    healthcheck:
      # Readiness of the worker's internal HTTP server (WORKER_HEALTH_PORT, default
      # 3001; not published, no Traefik route): PostgreSQL and Valkey reachable.
      # `/health` (liveness) also lists the repeatable jobs registered in Valkey.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/dockerfiles/web.Dockerfile
    image: oecp/web:${OECP_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # Origin only: apps/web appends the full path (/api/public/v1/...).
      NUXT_PUBLIC_API_BASE: https://${OECP_PORTAL_HOST}
      # Server-side rendering cannot reach the public host from inside the
      # container network; SSR fetches use the internal API origin.
      NUXT_API_INTERNAL_BASE: http://api:3000
      # Admin SPA OIDC client (apps/web/app/composables/useAuth.ts). Redirect
      # paths (/en/admin/callback, post-logout /en/...) are build-time defaults in
      # apps/web/nuxt.config.ts and must match client `oecp-admin` in the realm.
      NUXT_PUBLIC_OIDC_AUTHORITY: https://${OECP_AUTH_HOST}/realms/oecp
      NUXT_PUBLIC_OIDC_CLIENT_ID: oecp-admin
      # @nuxtjs/i18n: absolute hreflang/canonical links (warns on every SSR request if unset).
      NUXT_PUBLIC_I18N_BASE_URL: https://${OECP_PORTAL_HOST}
      # Shown on the public portal (home intro, titles).
      NUXT_PUBLIC_ALLIANCE_NAME: ${OECP_ALLIANCE_NAME:-the alliance}
      # Branding (branding/README.md): the alliance's images, mounted read-only
      # below and served at /branding/<file>. Header image of the home page and
      # the course list, and logo of the site header; empty = none (text brand,
      # no banner).
      NUXT_BRANDING_DIR: /data/branding
      NUXT_PUBLIC_HERO_IMAGE: ${OECP_HERO_IMAGE:-}
      # Empty = decorative header image (alt="").
      NUXT_PUBLIC_HERO_IMAGE_ALT: ${OECP_HERO_IMAGE_ALT:-}
      # Optional different image for the course list (empty = the home image).
      NUXT_PUBLIC_HERO_IMAGE_COURSES: ${OECP_HERO_IMAGE_COURSES:-}
      NUXT_PUBLIC_HERO_IMAGE_COURSES_ALT: ${OECP_HERO_IMAGE_COURSES_ALT:-}
      NUXT_PUBLIC_LOGO_IMAGE: ${OECP_LOGO_IMAGE:-}
      # Content-Security-Policy of the portal (spec §10): enforce | report-only | off.
      NUXT_CSP_MODE: ${NUXT_CSP_MODE:-enforce}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: oecp-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      # Deployment branding (not repository content); readable by uid 1000.
      - ${OECP_BRANDING_DIR:-./branding}:/data/branding:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      # The English home page returns 200 even when the api is down (it degrades gracefully).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.services.web.loadbalancer.server.port: "3000"
      traefik.http.routers.web.rule: Host(`${OECP_PORTAL_HOST}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls: "true"
      traefik.http.routers.web.priority: "1"
      traefik.http.routers.web.service: web
      traefik.http.routers.web.middlewares: security-headers@file
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Local development only (profile `dev`): Mailpit (MIT) as SMTP sink. Set
  # OECP_SMTP_HOST=mailpit, OECP_SMTP_PORT=1025, OECP_SMTP_STARTTLS=false in .env
  # so Keycloak (execute-actions e-mails) and the api (invitations) deliver
  # here; read the mail at http://127.0.0.1:${MAILPIT_PORT:-8025}/.
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      # Accept mail without SMTP AUTH and without TLS (Keycloak: auth=false).
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Web UI and REST API; SMTP (1025) stays on the Docker networks.
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      # backend: reachable from keycloak, api and worker by the name `mailpit`;
      # edge: required for the published UI port (backend is internal).
      - backend
      - edge
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Local development only (profile `dev`): simulated partner university
  # serving Open Education API v5.0 (consumer profile `eduxchange`) from a
  # synthetic University of Innsbruck dataset, so the harvester (spec §6.2) can
  # be developed and demonstrated without real partner credentials. Reached by
  # api and worker as http://oeapi-mock:8090 (HTTP Basic, see .env.example);
  # also published on 127.0.0.1:${OEAPI_MOCK_PORT:-8090} for curl. No Traefik
  # route. See tools/oeapi-mock/README.md.
  # -------------------------------------------------------------------------
  oeapi-mock:
    build:
      context: ../../tools/oeapi-mock
    image: oecp/oeapi-mock:${OECP_IMAGE_TAG:-dev}
    profiles: ["dev"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PORT: "8090"
      OEAPI_MOCK_AUTH: ${OEAPI_MOCK_AUTH:-basic:oecp:oecp-mock-secret}
      # /app/data/uibk.json (baseline) or /app/data/uibk-next-run.json (two
      # courses withdrawn, one changed); recreate the container to switch.
      OEAPI_MOCK_DATASET: ${OEAPI_MOCK_DATASET:-/app/data/uibk.json}
      OEAPI_MOCK_LATENCY_MS: ${OEAPI_MOCK_LATENCY_MS:-0}
      OEAPI_MOCK_FAIL_RATE: ${OEAPI_MOCK_FAIL_RATE:-0}
      OEAPI_MOCK_RATE_LIMIT_PER_SEC: ${OEAPI_MOCK_RATE_LIMIT_PER_SEC:-0}
      OEAPI_MOCK_TODAY: ${OEAPI_MOCK_TODAY:-}
    ports:
      - "127.0.0.1:${OEAPI_MOCK_PORT:-8090}:8090"
    networks:
      # backend: reachable from api and worker by the name `oeapi-mock`;
      # edge: required for the published port (backend is internal).
      - backend
      - edge
    healthcheck:
      # GET / with the configured credentials (tools/oeapi-mock/healthcheck.mjs).
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Local development only (profile `dev`): test SAML 2.0 IdP playing the
  # partner university URV (organization `urv`, Keycloak IdP alias `urv`), so
  # the brokered (eduGAIN-style) administrator path can be exercised end to end
  # (tools/e2e-identity/brokered-accept.js). SimpleSAMLphp 1.19 (LGPL-2.1) in
  # kenchan0130/simplesamlphp (MIT), configured by ./test-saml-idp: entity ID
  # https://idp.urv.test/saml2/idp, users in test-saml-idp/users.json,
  # attributes under their urn:oid names, assertions signed and encrypted.
  #
  # Front channel only: the browser reaches the IdP at
  # http://127.0.0.1:${OECP_DEV_IDP_PORT:-8091}/simplesaml/ (the SSO URL in the
  # realm) and posts its response to https://${OECP_AUTH_HOST}; Keycloak never
  # calls the IdP. The IdP reads Keycloak's SP descriptor (encryption and
  # signing keys) at http://keycloak:8080 over the `edge` network. The realm
  # side is enabled with OECP_DEV_IDP_ENABLED=true (keycloak-config).
  # See identity/keycloak/README.md, "Test SAML IdP (dev profile)".
  # -------------------------------------------------------------------------
  test-saml-idp:
    image: kenchan0130/simplesamlphp:1.19.9
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      # Absolute base URL: every endpoint the IdP generates points at the
      # published port, whatever Host header reaches the container.
      SIMPLESAMLPHP_IDP_BASE_URL: http://127.0.0.1:${OECP_DEV_IDP_PORT:-8091}/simplesaml/
      SIMPLESAMLPHP_IDP_SECRET_SALT: oecp-dev-test-saml-idp
      # Required by the image's own saml20-sp-remote.php, which is replaced below.
      SIMPLESAMLPHP_SP_ENTITY_ID: https://${OECP_AUTH_HOST}/realms/oecp
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: https://${OECP_AUTH_HOST}/realms/oecp/broker/urv/endpoint
      TEST_IDP_SP_ENTITY_ID: https://${OECP_AUTH_HOST}/realms/oecp
      TEST_IDP_SP_ACS_URL: https://${OECP_AUTH_HOST}/realms/oecp/broker/urv/endpoint
      TEST_IDP_SP_DESCRIPTOR_URL: http://keycloak:8080/realms/oecp/broker/urv/endpoint/descriptor
    volumes:
      - ./test-saml-idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
      - ./test-saml-idp/users.json:/var/www/simplesamlphp/config/users.json:ro
      - ./test-saml-idp/saml20-idp-hosted.php:/var/www/simplesamlphp/metadata/saml20-idp-hosted.php:ro
      - ./test-saml-idp/saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php:ro
      - ./test-saml-idp/cert/idp.urv.test.key:/var/www/simplesamlphp/cert/idp.urv.test.key:ro
      - ./test-saml-idp/cert/idp.urv.test.crt:/var/www/simplesamlphp/cert/idp.urv.test.crt:ro
    ports:
      - "127.0.0.1:${OECP_DEV_IDP_PORT:-8091}:8080"
    networks:
      edge:
        aliases: [idp.urv.test]
    healthcheck:
      # The IdP metadata endpoint (does not need Keycloak).
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/simplesaml/saml2/idp/metadata.php') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Backups (profile `backup`), spec §10: pgBackRest for the whole PostgreSQL
  # cluster (databases `oecp` and `keycloak`) with continuous WAL archiving
  # (point-in-time recovery), a full backup every Sunday and a differential
  # on the other days at 02:00 UTC, 35 days of recovery window; plus a daily
  # archive of the `uploads` volume (35 days). Repository repo1 = volume
  # `pgbackrest-repo`; repo2 (second site, S3/MinIO or SFTP) via .env.pgbackrest.
  # Writes textfile metrics for node-exporter (profile `observability`).
  # Script: postgres/bin/oecp-backup. Restore drill: scripts/restore-drill.sh.
  #   docker compose --profile backup up -d
  #   docker compose exec backup oecp-backup backup full     # on demand
  #   docker compose exec backup pgbackrest --stanza=oecp info
  # -------------------------------------------------------------------------
  backup:
    image: oecp/postgres:${OECP_IMAGE_TAG:-dev}
    # Built by the `postgres` service.
    pull_policy: never
    profiles: ["backup"]
    restart: unless-stopped
    init: true
    command: ["oecp-backup", "run"]
    # A backup in progress finishes its current step before the container stops.
    stop_grace_period: 60s
    # Group of the api/worker user (node, gid 1000), which owns the uploads
    # (files 0640, directories 0750): read access for the uploads archive.
    group_add: ["1000"]
    environment:
      OECP_BACKUP_TIME: ${OECP_BACKUP_TIME:-02:00}
      OECP_BACKUP_FULL_DAY: ${OECP_BACKUP_FULL_DAY:-7}
      OECP_BACKUP_CATCHUP_HOURS: ${OECP_BACKUP_CATCHUP_HOURS:-24}
      OECP_BACKUP_UPLOADS_RETENTION_DAYS: ${OECP_BACKUP_UPLOADS_RETENTION_DAYS:-35}
    env_file:
      - path: ./.env.pgbackrest
        required: false
    # secrets:
    #   - pgbackrest_repo2_cipher_pass
    #   - pgbackrest_repo2_s3_key_secret
    volumes:
      # Read-only: pgBackRest reads the files and asks the server (socket) for
      # the start and stop of each backup.
      - postgres_data:/var/lib/postgresql/data:ro
      - postgres_socket:/var/run/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - uploads:/data/uploads:ro
      - backup-metrics:/var/lib/oecp-backup-metrics
    # No network: PostgreSQL is reached over the shared Unix socket and repo1
    # is a volume. With repo2 on S3 or SFTP replace by `networks: [egress]`.
    network_mode: none
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The metrics file is rewritten every minute while the scheduler runs.
      test: ["CMD", "oecp-backup", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Optional observability (profile `observability`), spec §10: OTLP in,
  # metrics to Prometheus (also scraped from api and worker `/metrics`,
  # node-exporter and blackbox probes), logs to Loki, traces to the debug
  # exporter; container logs shipped to Loki by Alloy; alert rules in
  # observability/alert-rules.yml, notifications by Alertmanager (e-mail and/or
  # webhook, OECP_ALERT_* in .env); Grafana with the provisioned dashboards
  # "OECP overview" and "OECP logs".
  # -------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - backend
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
      - edge
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["observability"]
    restart: unless-stopped
    # Renders observability/alertmanager/alertmanager.yml.tmpl with the
    # OECP_ALERT_* values below (Alertmanager does not expand variables), then
    # starts Alertmanager on the result.
    entrypoint: ["/bin/sh", "/etc/alertmanager/oecp/entrypoint.sh"]
    environment:
      # Receivers: either or both; with neither, alerts are only shown in
      # Alertmanager and Grafana.
      OECP_ALERT_WEBHOOK_URL: ${OECP_ALERT_WEBHOOK_URL:-}
      OECP_ALERT_EMAIL_TO: ${OECP_ALERT_EMAIL_TO:-}
      OECP_ALERT_EMAIL_FROM: ${OECP_ALERT_EMAIL_FROM:-${OECP_SMTP_FROM:-no-reply@example.org}}
      # SMTP relay: defaults to the one of the application (OECP_SMTP_*).
      OECP_ALERT_SMTP_HOST: ${OECP_ALERT_SMTP_HOST:-${OECP_SMTP_HOST:-}}
      OECP_ALERT_SMTP_PORT: ${OECP_ALERT_SMTP_PORT:-${OECP_SMTP_PORT:-25}}
      OECP_ALERT_SMTP_REQUIRE_TLS: ${OECP_ALERT_SMTP_REQUIRE_TLS:-${OECP_SMTP_STARTTLS:-true}}
      # SMTP AUTH: user here, password as Docker secret `alert_smtp_password`
      # (uncomment below and in `secrets:`).
      OECP_ALERT_SMTP_USER: ${OECP_ALERT_SMTP_USER:-}
      OECP_ALERT_SMTP_PASSWORD_FILE: ${OECP_ALERT_SMTP_PASSWORD_FILE:-}
      OECP_ENVIRONMENT: ${OECP_ENVIRONMENT:-local}
    # secrets:
    #   - alert_smtp_password
    volumes:
      - ./observability/alertmanager:/etc/alertmanager/oecp:ro
      - alertmanager_data:/alertmanager
    networks:
      # backend: Prometheus, Mailpit (dev); edge: outbound SMTP and webhooks.
      - backend
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # Host metrics, chiefly disk usage of the data volumes (alert "disk > 80%"),
  # and the textfile metrics written by the `backup` service. The volumes are
  # mounted only so that their filesystems are reported (statfs); in production
  # a node-exporter on the host itself sees every filesystem.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|etc)($$|/)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - backup-metrics:/textfile:ro
      - postgres_data:/volumes/postgres_data:ro
      - pgbackrest-repo:/volumes/pgbackrest-repo:ro
      - uploads:/volumes/uploads:ro
    networks:
      - backend
    logging: *default-logging

  # HTTP probes of the internal readiness endpoints (api and worker `/ready`:
  # PostgreSQL and Valkey reachable), which `up` alone does not cover.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - backend
      # edge: the TLS probe of traefik:443 (job `tls`, alert OecpTlsCertificateExpiring)
      - edge
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.8
    profiles: ["observability"]
    restart: unless-stopped
    # Time-based retention: 90 days (spec §10), compactor-enforced.
    command: ["-config.file=/etc/loki/oecp.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/oecp.yaml:ro
      - loki_data:/loki
    networks:
      - backend
    logging: *default-logging

  # Read-only Docker API for Alloy (Tecnativa docker-socket-proxy, Apache-2.0,
  # HAProxy). Trade-off: the proxy itself still needs the Docker socket, but it
  # is the narrowest exposure that gives container logs without host-specific
  # paths (/var/lib/docker/containers cannot be bind-mounted on Docker Desktop):
  # only GET on /containers (list, inspect, logs), /events and /networks (list,
  # needed by Alloy's discovery.docker) passes; every other endpoint and every
  # POST/PUT/DELETE is answered 403. It sits on the internal `docker-api`
  # network, which only Alloy joins, never on `edge`.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      # discovery.docker lists the networks to label its targets (GET only).
      NETWORKS: "1"
      # Image defaults switched off (PING, VERSION): only the three above remain.
      PING: "0"
      VERSION: "0"
      POST: "0"
      DISABLE_IPV6: "1"
      LOG_LEVEL: warning
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    healthcheck:
      # An allowed GET through HAProxy to the socket (200), from inside.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/containers/json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging

  # Grafana Alloy (Apache-2.0): reads the logs of this Compose project's
  # containers through docker-socket-proxy and pushes them to Loki, labelled
  # service, container, project (and log_type on Traefik), see
  # observability/alloy.alloy. Positions are kept in `alloy_data`.
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["observability"]
    restart: unless-stopped
    user: "473:473"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
    environment:
      # Only containers labelled com.docker.compose.project=<this> are shipped.
      OECP_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-oecp}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - docker-socket-proxy
      - loki
    networks:
      - backend
      - docker-api
    healthcheck:
      # No wget/curl in the image: plain HTTP over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  grafana:
    # AGPL-3.0, used unmodified (spec §10).
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks:
      - backend
      - edge
    logging: *default-logging

networks:
  # Traefik and the services it routes to. Not internal: also gives api and
  # keycloak outbound access (SMTP, federation endpoints).
  edge:
    name: oecp-edge
  # Data stores and internal traffic only; no outbound access.
  backend:
    name: oecp-backend
    internal: true
  # Outbound access for the harvester (worker).
  egress:
    name: oecp-egress
  # Alloy -> docker-socket-proxy only (observability profile).
  docker-api:
    name: oecp-docker-api
    internal: true

volumes:
  idp-metadata:
  postgres_data:
  valkey_data:
  # CSV uploads (spec §3 `/data/uploads`; S3-compatible storage in v1). Back up daily (spec §10).
  uploads:
  traefik_acme:
  prometheus_data:
  loki_data:
  # Alloy's read positions in each container log (observability profile).
  alloy_data:
  grafana_data:
  alertmanager_data:
  # Unix socket directory of PostgreSQL, shared with `backup`.
  postgres_socket:
  # pgBackRest repo1 (backups, WAL archive) and the uploads archives
  # (uploads/uploads-YYYY-MM-DD.tar.gz). Back it up off-site too, or configure
  # repo2 (second site, .env.pgbackrest).
  pgbackrest-repo:
  # Textfile metrics of `backup`, read by node-exporter. tmpfs owned by the
  # postgres uid, so it does not matter which service creates it first; the
  # backup service rewrites the file every minute from the repository.
  backup-metrics:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=999,gid=999,mode=0755

# File-based Docker secrets; create them as described in secrets/README.md.
secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  oecp_db_password:
    file: ./secrets/oecp_db_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  oecp_backend_client_secret:
    file: ./secrets/oecp_backend_client_secret
  oecp_master_key:
    file: ./secrets/oecp_master_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # smtp_password:
  #   file: ./secrets/smtp_password
  # Alertmanager SMTP AUTH (OECP_ALERT_SMTP_PASSWORD_FILE=/run/secrets/alert_smtp_password):
  # alert_smtp_password:
  #   file: ./secrets/alert_smtp_password
  # pgBackRest repo2 (second site), see postgres/pgbackrest-repo2.env.example:
  # pgbackrest_repo2_cipher_pass:
  #   file: ./secrets/pgbackrest_repo2_cipher_pass
  # pgbackrest_repo2_s3_key_secret:
  #   file: ./secrets/pgbackrest_repo2_s3_key_secret
